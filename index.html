<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#FFF1D8">
<title>Solo nosotros · Tu biblioteca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..800,0..100,0..1&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--coral:#E85D4A;--amarillo:#F3C64E;--turquesa:#4FAE9B;--verde:#397451;--verde-dk:#2A5A3E;--crema:#FFF1D8;--papel:#FFFAF0;--arena:#F6E6C8;--borde:#E9DCC0;--tinta:#23382B;--suave:#4A5E51;--verde-soft:#DCE8E0;--radio:22px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:70px}
body{margin:0;background:var(--crema);color:var(--tinta);font-family:'DM Sans',system-ui,sans-serif;font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--verde);line-height:1.1;letter-spacing:-.02em;margin:0;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 96;text-wrap:balance}
p{margin:0}
a{color:var(--verde)}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
.narrow{max-width:560px}
.ico{display:inline-block;flex-shrink:0;line-height:0}.ico svg{width:100%;height:100%;display:block}
.wordmark{font-family:'Fraunces',Georgia,serif;font-weight:600;color:var(--verde);letter-spacing:-.025em;white-space:nowrap;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144;font-size:30px;line-height:1}
.wordmark.sm{font-size:16px;color:inherit}
.firma{display:flex;flex-direction:column;align-items:center;gap:10px}
.firma.big .wordmark{font-size:clamp(42px,9vw,58px)}
.iconrow{display:flex;gap:10px;align-items:center}
.eyebrow{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--verde);background:var(--verde-soft);padding:5px 11px;border-radius:999px;margin-bottom:12px}
.lead{color:var(--suave);font-size:17px;margin-top:10px;max-width:600px}
.hint{font-size:14px;color:var(--suave);margin-top:8px}.center{text-align:center}

/* botones */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:14px 22px;border-radius:999px;border:0;background:var(--verde);color:var(--crema);font:700 16px 'DM Sans',sans-serif;text-decoration:none;cursor:pointer;transition:transform .15s,background .15s,opacity .15s;text-align:center;line-height:1.2}
.btn:hover{transform:translateY(-1px)}
.btn:focus-visible,.chip:focus-visible,.mode:focus-visible,.nav-btn:focus-visible,.icon-btn:focus-visible{outline:3px solid var(--amarillo);outline-offset:2px}
.btn:disabled{opacity:.4;cursor:default;transform:none}
.btn.ghost{background:var(--papel);color:var(--verde);border:1.5px solid var(--verde)}
.btn.light{background:var(--crema);color:var(--verde)}
.btn.sm{min-height:44px;padding:10px 16px;font-size:15px}
.btn.big{width:100%;min-height:58px;font-size:18px;margin-top:22px}
.icon-btn{width:44px;height:44px;flex-shrink:0;border-radius:50%;border:1.5px solid var(--borde);background:var(--papel);color:var(--verde);font-size:22px;line-height:1;cursor:pointer}

/* navegación */
.nav{position:sticky;top:0;z-index:30;background:rgba(255,241,216,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--borde)}
.nav-in{max-width:860px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.nav-logo{background:none;border:0;padding:0;cursor:pointer;font:600 20px 'Fraunces',serif;color:var(--verde);letter-spacing:-.02em;white-space:nowrap;font-variation-settings:'SOFT' 100,'WONK' 1}
.nav-scroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav-scroll::-webkit-scrollbar{display:none}
.nav-btn{font:600 14px 'DM Sans',sans-serif;color:var(--suave);background:transparent;border:0;padding:9px 13px;border-radius:999px;cursor:pointer;white-space:nowrap;min-height:40px}
.nav-btn.active{background:var(--verde);color:var(--crema)}

/* inicio */
.hero{text-align:center;padding:40px 20px 20px;display:flex;flex-direction:column;align-items:center}
.hero .tag{font-size:15px;color:var(--suave);margin-top:10px}
.hero h1{font-size:clamp(34px,7vw,50px);margin-top:28px}
.hero .sub{color:var(--suave);margin-top:10px;max-width:480px}
.resume{margin-top:24px;display:flex;align-items:center;gap:14px;background:var(--papel);border:1.5px solid var(--verde);border-radius:18px;padding:14px 16px;text-align:left;flex-wrap:wrap;justify-content:center}
.resume div{display:flex;flex-direction:column}.resume span{font-size:14px;color:var(--suave)}
section{padding:46px 20px}
section h2{font-size:clamp(28px,5vw,36px)}
.deck-feature{margin-top:20px;border-radius:26px;padding:26px;display:flex;gap:22px;align-items:center;box-shadow:0 16px 36px -24px rgba(57,116,81,.6)}
.df-ic{width:110px;height:110px;border-radius:26px;background:rgba(255,241,216,.1);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.df-body{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.df-body h3{font-size:30px}
.df-body .meta{font-size:14px;opacity:.9}
.badge{background:var(--amarillo);color:#3A2C05;font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.loading{font-weight:700}
.deck-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px}
.deck{border-radius:var(--radio);padding:20px;display:flex;flex-direction:column;gap:10px}
.deck.locked{opacity:.82}
.deck-head{display:flex;justify-content:space-between;align-items:center}
.status{font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;background:rgba(255,250,240,.85);color:var(--verde);padding:4px 9px;border-radius:999px}
.deck h3{font-size:22px}
.deck p{font-size:15px}
.deck-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-top:12px;border-top:1px dashed rgba(57,116,81,.25);font-size:14px}
.lock{font-size:20px}
.matrix-wrap{overflow-x:auto;margin-top:20px;border-radius:18px;border:1px solid var(--borde)}
.matrix{width:100%;border-collapse:collapse;background:var(--papel);min-width:620px;font-size:15px}
.matrix th,.matrix td{padding:13px 14px;text-align:left;border-bottom:1px solid var(--borde);vertical-align:top}
.matrix th{background:var(--arena);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--suave)}
.matrix .ok{color:var(--verde);font-weight:700}.matrix .mid{color:#8A6410;font-weight:700}
.matrix tr.no td{background:#FCE7E3;border-bottom:0}
.tag-no{display:block;margin-top:6px;width:max-content;background:#C23B2A;color:#fff;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.rules{display:grid;gap:10px;margin-top:18px}
.rules div{display:flex;gap:12px;align-items:flex-start;background:var(--papel);border:1px solid var(--borde);border-radius:14px;padding:13px 15px}
.rules b{width:28px;height:28px;border-radius:50%;background:var(--coral);color:#2B1410;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.faq{display:grid;gap:10px;margin-top:20px}
.faq details{background:var(--papel);border:1px solid var(--borde);border-radius:16px;padding:0 18px;transition:border-color .2s}
.faq details[open]{border-color:var(--verde)}
.faq summary{cursor:pointer;list-style:none;padding:17px 30px 17px 0;font-weight:700;color:var(--verde);position:relative;min-height:44px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:'+';position:absolute;right:0;top:50%;transform:translateY(-50%);font:600 26px 'Fraunces',serif;color:var(--coral);transition:transform .25s}
.faq details[open] summary::after{transform:translateY(-50%) rotate(45deg)}
.faq .ans{padding:0 0 16px;display:grid;gap:8px;color:var(--suave);animation:abrir .25s ease}
@keyframes abrir{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.hist{display:grid;gap:10px;margin-top:18px}
.hist-row{display:flex;align-items:center;gap:14px;background:var(--papel);border:1px solid var(--borde);border-radius:16px;padding:14px 16px}
.hist-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.bar{height:8px;border-radius:999px;background:var(--arena);overflow:hidden}.bar span{display:block;height:100%;border-radius:999px;transition:width .4s}
.hist-n{font-size:13px;color:var(--suave)}
.foot{padding:40px 20px 60px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px;font-size:14px;color:var(--suave);border-top:1px solid var(--borde);margin-top:20px}
.foot p{max-width:560px}

/* preparar */
.setup-top,.play-top{display:flex;align-items:center;gap:12px;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top))}
.st-title{display:flex;align-items:center;gap:10px;font:600 20px 'Fraunces',serif;color:var(--verde);line-height:1.15}
.setup-body,.cierre-body{padding-top:26px;padding-bottom:50px}
.setup-body h2,.cierre-body h2{font-size:32px;margin-bottom:6px}
.field{border:0;padding:0;margin:24px 0 0;display:block}
.field legend,.legend{font-weight:700;color:var(--tinta);margin-bottom:10px;display:block;padding:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:10px 16px;border-radius:999px;border:1.5px solid var(--borde);background:var(--papel);color:var(--tinta);font:600 15px 'DM Sans',sans-serif;cursor:pointer}
.chip.on{background:var(--verde);border-color:var(--verde);color:var(--crema)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--borde);border-radius:999px;background:var(--papel);overflow:hidden}
.stepper button{width:52px;height:48px;border:0;background:none;font-size:24px;color:var(--verde);cursor:pointer}
.stepper output{min-width:46px;text-align:center;font:700 22px 'Fraunces',serif;color:var(--verde)}
.modes{display:grid;gap:8px}
.mode{display:flex;flex-direction:column;gap:3px;text-align:left;padding:14px 16px;border-radius:16px;border:1.5px solid var(--borde);background:var(--papel);cursor:pointer;font:inherit;color:var(--tinta)}
.mode.on{border-color:var(--verde);background:var(--verde-soft)}
.m-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.m-desc{font-size:14px;color:var(--suave)}
.rec{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;background:var(--amarillo);color:#3A2C05;padding:3px 8px;border-radius:999px;white-space:nowrap}
.warn{margin-top:10px;background:#FCE7E3;color:#7A2418;border-radius:12px;padding:11px 13px;font-size:14px;font-weight:500}
.summary{margin-top:26px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;border:2px solid;border-radius:18px;padding:14px;background:var(--papel)}
.summary div{display:flex;flex-direction:column;align-items:center;text-align:center}
.summary b{font:700 30px 'Fraunces',serif;color:var(--verde)}.summary span{font-size:12.5px;color:var(--suave);line-height:1.3}
.warnbox{display:block;border-color:#C23B2A;color:#7A2418;font-weight:500}
.rompe{margin-top:16px;border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.rompe .eyebrow{background:var(--papel);margin:0}
.rq{font:600 22px/1.25 'Fraunces',serif;color:var(--tinta)}

/* juego */
.play{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.play-top{justify-content:space-between}
.pt-name{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700;font-size:14px;color:var(--verde);text-align:center;line-height:1.25}
.pt-num{font-size:13px;font-weight:700;color:var(--suave);white-space:nowrap}
.progress{height:6px;margin:4px 20px 14px;border-radius:999px;background:#EADCC0}.progress span{display:block;height:100%;border-radius:999px;transition:width .35s}
.gcard{flex:1;margin:0 18px;border-radius:28px;padding:24px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:20px;box-shadow:0 18px 40px -24px rgba(57,116,81,.55);animation:entra .35s ease;min-height:330px}
@keyframes entra{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.gchips{display:flex;gap:8px;flex-wrap:wrap}
.gchip{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:6px 12px;border-radius:999px}
.gchip.alt{background:rgba(255,250,240,.85);color:var(--verde)}
.gq{font:600 clamp(26px,7.4vw,32px)/1.18 'Fraunces',Georgia,serif;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 72;text-wrap:balance}
.gq-k{display:block;font:700 14px 'DM Sans',sans-serif;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;opacity:.85}
.gfoot{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.gmark{display:flex;align-items:center;gap:6px}
.controls{padding:16px 18px 0;display:flex;flex-direction:column;align-items:center;gap:10px}
.btn.paso{min-height:46px;min-width:150px;background:transparent;color:var(--verde);border:1.5px dashed var(--verde)}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%}
.row2.after{margin-top:22px}

/* opinión */
.opinion{margin-top:30px;background:var(--papel);border:1px solid var(--borde);border-radius:22px;padding:22px 20px;display:flex;flex-direction:column}
.opinion h3{font-size:26px}
.opinion.done{align-items:center;text-align:center;gap:10px}
.stars-in{display:flex;gap:4px;margin-top:14px}
.star{width:52px;height:52px;border:0;background:none;font-size:40px;line-height:1;color:#E3D3B0;cursor:pointer;padding:0;transition:transform .12s,color .12s}
.star.on{color:#E8B23A}
.star-label{margin-top:4px;font-weight:700;color:var(--verde);min-height:24px}.star:active{transform:scale(.9)}
.star:focus-visible{outline:3px solid var(--amarillo);border-radius:10px}
.opinion input:not([type]){width:100%;font:inherit;color:var(--tinta);background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:12px 14px;min-height:48px}
.opinion input:not([type]):focus{outline:3px solid var(--amarillo);border-color:var(--verde)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.check{display:flex;gap:12px;align-items:flex-start;margin-top:20px;font-size:14.5px;color:var(--suave);cursor:pointer}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--verde);flex-shrink:0}
@media (max-width:420px){.two{grid-template-columns:1fr}}
/* cierre */
.photo-btns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:22px}
textarea{width:100%;font:inherit;color:var(--tinta);background:#fff;border:1.5px solid var(--borde);border-radius:14px;padding:12px 14px;resize:vertical}
textarea:focus{outline:3px solid var(--amarillo);border-color:var(--verde)}
.keepsake{margin:20px 0 16px;border-radius:18px;overflow:hidden;box-shadow:0 18px 40px -26px rgba(0,0,0,.45)}
.keepsake canvas{width:100%;height:auto;display:block}

.reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
.reveal.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}.gcard,.faq .ans{animation:none}}
@media (max-width:600px){.deck-grid{grid-template-columns:1fr}.deck-feature{flex-direction:column;align-items:flex-start}.df-ic{width:84px;height:84px}.photo-btns{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="root"></div>
